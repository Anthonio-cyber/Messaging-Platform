<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content is what makes the on-screen keyboard shrink the
      layout viewport instead of sliding over the top of it. Chrome on Android defaults to
      resizes-visual, which leaves the page full height and puts the composer behind the
      keyboard; every dvh unit and every fixed element then measures the wrong box.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0e11" />
    <meta
      name="description"
      content="Veylo is private messaging with a custom identity instead of a phone number. Message requests, privacy controls, and end-to-end encrypted conversations."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Veylo — Message privately, keep your number private</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Veylo needs JavaScript because messages are encrypted and decrypted in your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
